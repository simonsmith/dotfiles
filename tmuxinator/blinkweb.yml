name: blinkweb
root: ~/blink/web
startup_window: code

windows:
  - code:
      layout: main-vertical
      panes:
        - tmux set -w @agent_layout 1; tmux-agent-fit "$(tmux display -p "#{window_id}")"; nvim
        - claude
  - dev:
      layout: main-horizontal
      panes:
        -
        -
  - proxy:
    - p proxy --backend staging
